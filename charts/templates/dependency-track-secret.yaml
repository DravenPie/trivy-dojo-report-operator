{{- if and .Values.dependencyTrack.enabled .Values.dependencyTrack.apiCredentials.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "charts.dependencyTrackSecretName" . }}
  labels:
  {{- include "charts.labels" . | nindent 4 }}
stringData:
  {{ required "dependencyTrack.apiCredentials.apiKeySecretKey is required" .Values.dependencyTrack.apiCredentials.apiKeySecretKey }}: {{ required "dependencyTrack.apiCredentials.apiKey is required when createSecret=true" .Values.dependencyTrack.apiCredentials.apiKey | quote }}
type: Opaque
{{- end }}
