defectDojoApiCredentials:
  createSecret: true
  apiKey: "YOUR_DEFECTDOJO_API_KEY"
  url: "YOUR_DEFECTDOJO_URL"
# dependencyTrack: opt-in upload of Trivy Operator SbomReports to Dependency-Track.
# Disabled by default: when false only the DEPENDENCY_TRACK_ENABLED flag is rendered, no Secret
# is required and the ClusterRole gets no sbomreports rule (the SbomReport CRD is not needed).
dependencyTrack:
  # enabled: turns the integration on; url and the API key Secret become mandatory.
  enabled: false
  # url: base URL of Dependency-Track, http or https (DEPENDENCY_TRACK_URL).
  url: ""
  # apiCredentials: where the Dependency-Track API key comes from (DEPENDENCY_TRACK_API_KEY).
  apiCredentials:
    # createSecret: true = Helm creates the Secret from apiKey;
    #               false = use an existing Secret (ExternalSecret, operator-managed Secret, ...).
    createSecret: true
    # apiKey: only used when createSecret is true. Never commit a real key; pass it with --set or a private values file.
    apiKey: ""
    # secretName: createSecret=false: name of the existing Secret (required).
    #             createSecret=true: optional override of the generated name
    #             (default <fullname>-dependency-track-api-credentials).
    secretName: ""
    # apiKeySecretKey: key inside the Secret that holds the API key.
    apiKeySecretKey: apiKey
  # identities: rendered as-is to JSON in DEPENDENCY_TRACK_IDENTITIES; the operator validates it at startup.
  # Templates accept {namespace}, {name} and {env}; {product} only in testTitle and tags. Example:
  #   registries: [registry.example.com]        # exact report.registry.server; empty = all registries
  #   default:                                  # any other namespace, used as is; absent = skipped
  #     env: staging
  #     productType: my-team-staging
  #     environment: Staging
  #     tags: ["{env}", "{namespace}"]          # optional, this is the default
  #     aclTeam: my-team-staging                # optional, without it no ACL is applied
  #   prefixes:                                 # "dev-my-app" -> namespace "my-app" with this entry
  #     dev-: {env: dev, productType: my-team-dev, environment: Development, aclTeam: my-team-dev}
  #   namespaces:                               # "<k8s namespace>" -> keys that differ from prefixes/default
  #     my-ns:
  #       namespace: my-app
  #   repositories:                             # "<k8s namespace>/<repository>" -> optional overrides
  #     my-ns/my-image:
  #       name: my-app-api
  #       namespace: my-app
  #   exclude:                                  # workload label key -> values that are never sent
  #     example.com/app: [my-app-canary]
  #   defectDojo:                               # all optional
  #     engagement: dependency-track
  #     product: "{namespace}-{env}"
  #     testTitle: "{namespace}/{name}"
  #     groupBy: component_name+component_version
  identities: {}
kubernetesClusterDomain: cluster.local
account:
  serviceAccount:
    annotations: {}
excludedNamespaces: []
operator:
  ports:
    - name: metrics
      port: 80
      protocol: TCP
      targetPort: metrics
  replicas: 1
  trivyDojoReportOperator:
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      privileged: false
      readOnlyRootFilesystem: true
      runAsGroup: 1000
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    resources: {}
    affinity: {}
    nodeSelector: {}
    tolerations: []
    extraVolumeMounts: []
    extraVolumes: []
    env:
      defectDojoActive: "true"
      defectDojoAutoCreateContext: "true"
      defectDojoCloseOldFindings: "false"
      defectDojoCloseOldFindingsProductScope: "false"
      defectDojoDeduplicationOnEngagement: "true"
      defectDojoDoNotReactivate: "true"
      defectDojoEngagementName: engagement
      defectDojoEnvName: Development
      defectDojoEvalEngagementName: "false"
      defectDojoEvalEnvName: "false"
      defectDojoEvalProductName: "false"
      defectDojoEvalProductDescription: "false"
      defectDojoEvalProductTypeName: "false"
      defectDojoEvalServiceName: "false"
      defectDojoEvalTags: "false"
      defectDojoEvalTestTitle: "false"
      defectDojoApplyTagsToFindings: "false"
      defectDojoApplyTagsToEndpoints: "false"
      defectDojoVersion: ""
      defectDojoEvalVersion: "false"
      defectDojoApplyTagsToProduct: "false"
      defectDojoEnableProductTagInheritance: "false"
      defectDojoMinimumSeverity: Info
      defectDojoProductName: product
      defectDojoProductDescription: Created by trivy-dojo-report-operator
      defectDojoProductTypeName: Research and Development
      defectDojoPushToJira: "false"
      defectDojoServiceName: ""
      defectDojoTags: ""
      defectDojoTestTitle: Kubernetes
      defectDojoVerified: "false"
      reports: vulnerabilityreports
      http_proxy: ""
      https_proxy: ""
      logLevel: "INFO"
    image:
      repository: ghcr.io/telekom-mms/docker-trivy-dojo-operator
      tag: 0.11.1
    imagePullSecrets: []
    transformation:
      enabled: false
      interpreter: "bash"
      scanType: "Generic Findings Import"
      scriptFilename: "wrapper.sh"
      # scriptConfigMap: defines the ConfigMap that holds the transformation scripts.
      # create: when true, Helm creates and manages the ConfigMap; the name is
      #         derived automatically from the release. Only data is needed.
      # data:   map of filename -> script content; only used when create: true.
      # ref:    name of an existing externally-deployed ConfigMap to mount;
      #         only used when create: false.
      #
      # Example — reference an externally-deployed ConfigMap:
      # scriptConfigMap:
      #   ref: my-transform-scripts
      #
      # Example #2 — let Helm manage the ConfigMap:
      # scriptConfigMap:
      #   create: true
      #   data:
      #     wrapper.sh: |
      #       #!/bin/bash
      #       echo "$REPORT_JSON" | python3 /scripts/transform.py
      #     transform.py: |
      #       import sys, json
      #       print(sys.stdin.read())
      scriptConfigMap:
        ref: ""
        create: false
        data: {}
  type: ClusterIP
  podSecurityContext:
    runAsNonRoot: true
    fsGroupChangePolicy: Always
    fsGroup: 1000
# rbac.additionalRules: Additional RBAC rules appended to the base ClusterRole.
# These rules are strictly additive — the built-in base rules are always present
# and cannot be removed through this value.
#
# Each entry must be a valid RBAC rule object (apiGroups, resources, verbs).
# The rules below are the ones needed when the transformation feature is used
# to enrich reports with workload context (pods, deployments, jobs, …):
#
# rbac:
#   additionalRules:
#     - apiGroups: [""]
#       resources: [pods, secrets, replicationcontrollers]
#       verbs: [list, watch, get]
#     - apiGroups: [apps]
#       resources: [deployments, statefulsets, daemonsets, replicasets]
#       verbs: [get]
#     - apiGroups: [batch]
#       resources: [jobs, cronjobs]
#       verbs: [get]
rbac:
  additionalRules: []
